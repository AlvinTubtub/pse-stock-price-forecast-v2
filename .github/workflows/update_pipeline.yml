name: Fast Pipeline (data + inference, no training)

# Triggered externally by Cron-job.org (Mon-Fri, 4:00 PM Philippine Time)
# via repository_dispatch for full scheduled daily flow.
# workflow_dispatch is used by the Admin Site for action-specific execution:
#   - data_update: checks calendar & ingests PSE EOD data only
#   - inference: runs daily model inference on existing models only
#   - export: exports frontend JSON artifacts only
#   - validate: validates exported JSON artifacts only
#
# This workflow NEVER trains models.
# Weekly model retraining is handled separately by train_models.yml.

on:
  repository_dispatch:
    types: [update-pse-data]
  workflow_dispatch:
    inputs:
      action:
        description: "Admin pipeline action"
        required: true
        type: choice
        options:
          - data_update
          - inference
          - export
          - validate

concurrency:
  group: pse-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-fast.txt
          pip install -r requirements-inference.txt

      # Calendar check: runs for scheduled execution or manual data_update
      - name: Check PSE Trading Calendar
        id: check_calendar
        if: github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'data_update')
        working-directory: backend
        run: |
          python scripts/check_pse_trading_day.py

      # Action: data_update (Admin manual trigger: ingestion only, no retraining, no inference)
      - name: Run data ingestion only (no training, no inference)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'data_update' && steps.check_calendar.outputs.is_trading_day == 'true'
        working-directory: backend
        run: |
          python run_pipeline.py --no-train --no-inference

      # Scheduled Fast Pipeline: full ingestion + daily inference
      - name: Run scheduled pipeline (ingestion + daily inference, no training)
        if: github.event_name == 'repository_dispatch' && steps.check_calendar.outputs.is_trading_day == 'true'
        working-directory: backend
        run: |
          python run_pipeline.py --no-train

      # Action: inference (Admin manual trigger: daily inference with persisted models only)
      - name: Run daily inference only (persisted models)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'inference'
        working-directory: backend
        run: |
          python scripts/daily_inference.py

      # Action: export (or downstream of data_update / inference / scheduled pipeline)
      - name: Export frontend JSON artifacts
        if: >
          (github.event_name == 'repository_dispatch' && steps.check_calendar.outputs.is_trading_day == 'true') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'data_update' && steps.check_calendar.outputs.is_trading_day == 'true') ||
          (github.event_name == 'workflow_dispatch' && (github.event.inputs.action == 'inference' || github.event.inputs.action == 'export'))
        working-directory: backend
        run: |
          python scripts/export_forecast_artifacts.py

      # Action: validate (or downstream of export / data_update / inference / scheduled pipeline)
      - name: Validate exported artifacts
        if: >
          (github.event_name == 'repository_dispatch' && steps.check_calendar.outputs.is_trading_day == 'true') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'data_update' && steps.check_calendar.outputs.is_trading_day == 'true') ||
          (github.event_name == 'workflow_dispatch' && (github.event.inputs.action == 'inference' || github.event.inputs.action == 'export' || github.event.inputs.action == 'validate'))
        working-directory: backend
        run: |
          python scripts/validate_exports.py

      # Commit & push changes (skipped for validate action)
      - name: Commit and push changed artifacts
        if: >
          (github.event_name == 'repository_dispatch' && steps.check_calendar.outputs.is_trading_day == 'true') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'data_update' && steps.check_calendar.outputs.is_trading_day == 'true') ||
          (github.event_name == 'workflow_dispatch' && (github.event.inputs.action == 'inference' || github.event.inputs.action == 'export'))
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            backend/data/raw/*.csv \
            backend/prediction_cache/*.json \
            backend/latest_processed.json \
            frontend/public/forecasts

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automated update (${{ github.event.inputs.action || 'pipeline' }}) ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi